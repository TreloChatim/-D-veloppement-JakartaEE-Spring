<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Connexion</h1>
    <div class="alert error" th:if="${param.error}">Nom d'utilisateur ou mot de passe incorrect.</div>
    <div class="alert info" th:if="${param.logout}">Vous avez été déconnecté.</div>
    <!-- th:action ajoute automatiquement le jeton CSRF -->
    <form th:action="@{/login}" method="post">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" required autofocus>
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" required>
        <button type="submit">Se connecter</button>
    </form>
</div>
</body>
</html>
